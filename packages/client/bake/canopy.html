<!doctype html>
<!-- Dev-only bake page (not part of the build): see tools/assets/bake_canopy.mjs. -->
<html>
  <body style="margin: 0; background: #000">
    <script type="module">
      import * as THREE from 'three';
      // A dense, seamless leaf-mass surface from the CC0 shrub scan: several hundred scan
      // shrubs piled at random depths, wrapped around a unit tile, lit from above and rendered
      // top-down. Deeper leaves sink into shade (fog), gaps show the dark interior.
      const RENDER = 1024;
      const OUT = 512;
      // The pattern repeats every PERIOD of the output, so any PERIOD-wide window (the one bush
      // cores sample: foliageAtlas CANOPY_REPEAT_INSET) tiles seamlessly.
      const PERIOD = 320 / 512;
      const base = new URLSearchParams(location.search).get('in');
      const meta = await (await fetch(`${base}/shrubs.json`)).json();
      const bin = await (await fetch(`${base}/shrubs.bin`)).arrayBuffer();
      const tl = new THREE.TextureLoader();
      const [albedo, normal] = await Promise.all([
        tl.loadAsync(`${base}/albedo.png`),
        tl.loadAsync(`${base}/normal.jpg`),
      ]);
      for (const t of [albedo, normal]) t.flipY = false; // glTF uv convention
      albedo.colorSpace = THREE.SRGBColorSpace;
      const geos = meta.variants.map((v) => {
        const g = new THREE.BufferGeometry();
        const f32 = (o, n) => new Float32Array(bin, o, n);
        g.setAttribute('position', new THREE.BufferAttribute(f32(v.position, v.vertices * 3), 3));
        g.setAttribute('normal', new THREE.BufferAttribute(f32(v.normal, v.vertices * 3), 3));
        g.setAttribute('uv', new THREE.BufferAttribute(f32(v.uv, v.vertices * 2), 2));
        g.setIndex(new THREE.BufferAttribute(new Uint32Array(bin, v.index, v.indices), 1));
        return g;
      });
      const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(RENDER, RENDER);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.NoToneMapping;
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0b1607);
      scene.fog = new THREE.Fog(0x0b1607, 1.0, 1.95);
      scene.add(new THREE.HemisphereLight(0xdfeeff, 0x2a3318, 1.6));
      const sun = new THREE.DirectionalLight(0xfff4e0, 2.4);
      sun.position.set(0.3, 1, 0.2);
      scene.add(sun);
      const mat = new THREE.MeshStandardMaterial({
        map: albedo,
        normalMap: normal,
        alphaTest: 0.5,
        side: THREE.DoubleSide,
        roughness: 0.8,
      });
      let seed = 7;
      const rnd = () => (seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0) / 4294967296;
      for (let i = 0; i < 200; i++) {
        const g = geos[i % geos.length];
        const x = rnd();
        const z = rnd();
        const y = -Math.pow(rnd(), 0.7) * 0.9;
        const s = 0.3 + rnd() * 0.2;
        const e = new THREE.Euler(rnd() * 6.2832, rnd() * 6.2832, rnd() * 6.2832);
        const q = new THREE.Quaternion().setFromEuler(e);
        // Copies at every period offset the view can see: leaves crossing an edge reappear.
        for (let ox = -2; ox <= 2; ox++) {
          for (let oz = -2; oz <= 2; oz++) {
            const m = new THREE.Mesh(g, mat);
            m.position.set(x + ox - 0.5, y, z + oz - 0.5);
            m.quaternion.copy(q);
            m.scale.setScalar(s);
            scene.add(m);
          }
        }
      }
      const half = 0.5 / PERIOD; // one scene unit = one period
      const cam = new THREE.OrthographicCamera(-half, half, half, -half, 0.01, 3);
      cam.position.set(0, 1, 0);
      cam.up.set(0, 0, -1);
      cam.lookAt(0, 0, 0);
      renderer.render(scene, cam);
      // Grade (the scan is olive-grey): more saturation, greener, a touch more contrast.
      const cv = new OffscreenCanvas(OUT, OUT);
      const ctx = cv.getContext('2d');
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(renderer.domElement, 0, 0, OUT, OUT);
      const img = ctx.getImageData(0, 0, OUT, OUT);
      const d = img.data;
      for (let i = 0; i < d.length; i += 4) {
        const c = [d[i] / 255, d[i + 1] / 255, d[i + 2] / 255];
        const l = (c[0] + c[1] + c[2]) / 3;
        const k = [0.82, 1.08, 0.78];
        for (let j = 0; j < 3; j++) {
          const v = ((l + (c[j] - l) * 1.35) * k[j] - 0.5) * 1.12 + 0.52;
          d[i + j] = Math.round(Math.min(1, Math.max(0, v)) * 255);
        }
      }
      ctx.putImageData(img, 0, 0);
      // Lossless out of the page; bake_canopy.mjs encodes the shipped WebP.
      const blob = await cv.convertToBlob({ type: 'image/png' });
      const bytes = new Uint8Array(await blob.arrayBuffer());
      let s = '';
      for (const b of bytes) s += String.fromCharCode(b);
      window.__bake = btoa(s);
    </script>
  </body>
</html>
