<!doctype html>
<html lang="en">
  <meta charset="UTF-8" /><title>Palace masonry GPU coverage</title>
  <body style="background: #101820; color: white; font: 14px system-ui">
    <h1>Physical masonry coverage</h1>
    <p>Shipped GLSL compared with independent rectangle intersection areas on WebGL float32.</p>
    <button id="run">Run GPU coverage</button>
    <pre id="receipt">Ready.</pre>
    <script type="module">
      import {
        PALACE_MASONRY as masonry,
        PALACE_MASONRY_GLSL,
      } from './src/render/palaceMasonry.ts';
      function stripeArea(lo, hi, period, width, offset = 0) {
        let area = 0;
        for (
          let n = Math.floor((lo + offset) / period) - 1;
          n <= Math.ceil((hi + offset) / period) + 1;
          n++
        ) {
          const centre = n * period - offset;
          area += Math.max(0, Math.min(hi, centre + width / 2) - Math.max(lo, centre - width / 2));
        }
        return area;
      }
      function oracle(uv, footprint) {
        const [x, y] = uv,
          [w, h] = footprint;
        const [xl, xh, yl, yh] = [x - w / 2, x + w / 2, y - h / 2, y + h / 2];
        let area = stripeArea(yl, yh, masonry.height, masonry.jointY) * w;
        for (
          let row = Math.floor(yl / masonry.height) - 1;
          row <= Math.ceil(yh / masonry.height);
          row++
        ) {
          const bottom = row * masonry.height + masonry.jointY / 2;
          const top = (row + 1) * masonry.height - masonry.jointY / 2;
          const solidHeight = Math.max(0, Math.min(yh, top) - Math.max(yl, bottom));
          const odd = ((row % 2) + 2) % 2;
          area +=
            solidHeight *
            stripeArea(xl, xh, masonry.width, masonry.jointX, (odd * masonry.width) / 2);
        }
        return area / (w * h);
      }
      document.querySelector('#run').onclick = () => {
        const cases = [];
        for (const y of [0.006, 0.275, 0.55, 0.825, -0.006, 143.275])
          for (const x of [0.006, 0.825, 1.647, -0.006])
            for (const footprint of [
              [0.001, 0.001],
              [0.05, 0.08],
              [0.3, 0.4],
              [1.65, 1.1],
              [3.3, 2.2],
            ])
              cases.push({ uv: [x, y], footprint });
        const canvas = document.createElement('canvas');
        canvas.width = cases.length;
        canvas.height = 1;
        const gl = canvas.getContext('webgl2');
        if (!gl || !gl.getExtension('EXT_color_buffer_float'))
          throw new Error('Float target unavailable');
        const texture = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, texture);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, cases.length, 1, 0, gl.RGBA, gl.FLOAT, null);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        const target = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, target);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
        if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE)
          throw new Error('Incomplete target');
        function compile(type, source) {
          const shader = gl.createShader(type);
          gl.shaderSource(shader, source);
          gl.compileShader(shader);
          if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS))
            throw new Error(gl.getShaderInfoLog(shader));
          return shader;
        }
        const vs = compile(
          gl.VERTEX_SHADER,
          `#version 300 es
  void main(){vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));gl_Position=vec4(p*2.-1.,0.,1.);}`,
        );
        const fs = compile(
          gl.FRAGMENT_SHADER,
          `#version 300 es
  precision highp float; uniform vec4 cases[${cases.length}];out vec4 result;
  ${PALACE_MASONRY_GLSL}
  void main(){vec4 c=cases[int(gl_FragCoord.x)]; result=vec4(palaceMortar(c.xy,c.zw),palaceBlockPresence(c.zw),palaceBlockHash(c.xy),1);}`,
        );
        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS))
          throw new Error(gl.getProgramInfoLog(program));
        gl.useProgram(program);
        gl.uniform4fv(
          gl.getUniformLocation(program, 'cases'),
          new Float32Array(cases.flatMap((c) => [...c.uv, ...c.footprint])),
        );
        gl.viewport(0, 0, cases.length, 1);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        const pixels = new Float32Array(cases.length * 4);
        gl.readPixels(0, 0, cases.length, 1, gl.RGBA, gl.FLOAT, pixels);
        if (gl.getError() !== gl.NO_ERROR) throw new Error('GPU readback failed');
        const rows = cases.map((c, i) => ({
          ...c,
          expected: oracle(c.uv, c.footprint),
          actual: pixels[i * 4],
          presence: pixels[i * 4 + 1],
          block: pixels[i * 4 + 2],
        }));
        const errors = rows.filter(
          (c) =>
            !Number.isFinite(c.actual) ||
            Math.abs(c.actual - c.expected) > 0.002 ||
            c.block < 0 ||
            c.block > 1 ||
            c.presence < 0 ||
            c.presence > 1,
        );
        const large = rows.filter((c) => c.footprint[0] >= masonry.width);
        const ext = gl.getExtension('WEBGL_debug_renderer_info');
        const result = {
          measuredAt: new Date().toISOString(),
          scope:
            'Shipped masonry GLSL, 120 synthetic footprints versus independent intersection oracle; not whole-map AAA acceptance',
          hardware: ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : null,
          cases: rows.length,
          errors: errors.length,
          maximumAbsoluteError: Math.max(...rows.map((c) => Math.abs(c.actual - c.expected))),
          unresolvedVariationCases: large.filter((c) => c.presence !== 0).length,
          passed: errors.length === 0 && large.every((c) => c.presence === 0),
          failures: errors,
          rows,
        };
        document.querySelector('#receipt').textContent = JSON.stringify(result, null, 2);
        gl.deleteProgram(program);
        gl.deleteShader(vs);
        gl.deleteShader(fs);
        gl.deleteTexture(texture);
        gl.deleteFramebuffer(target);
        gl.getExtension('WEBGL_lose_context')?.loseContext();
      };
    </script>
  </body>
</html>
