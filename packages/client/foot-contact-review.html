<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Market boot contact comparison</title>
    <style>
      body {
        margin: 0;
        background: #11151a;
        color: #e2edf5;
        font: 14px system-ui;
      }
      header {
        padding: 12px;
        display: flex;
        gap: 18px;
        align-items: center;
      }
      button,
      select {
        padding: 8px;
        background: #253340;
        color: white;
        border: 1px solid #52687b;
      }
      #labels {
        display: flex;
        justify-content: space-around;
        padding: 8px;
      }
      canvas {
        display: block;
        width: 100%;
        height: calc(100vh - 100px);
      }
    </style>
  </head>
  <body>
    <header>
      <strong>Market stair contact — same shipped rig and pose</strong>
      <button id="stance">Switch to crouched</button>
      <select aria-label="Stair position" id="position"></select>
      <span id="status">Loading actual soldier assets…</span>
    </header>
    <div id="labels">
      <span>Before — animation only</span><span>After — terrain foot placement</span>
    </div>
    <script type="module">
      import * as THREE from 'three';
      import { initPhysics, PhysicsWorld, getMap, resolveMap } from '@wd/shared';
      import { loadSoldiers, Soldier } from './src/render/soldiers.ts';
      import report from '../../tools/assets/build/market-stair-support-20261006.json';
      await initPhysics();
      const map = resolveMap(getMap('defilad'), 'market');
      const world = new PhysicsWorld(map);
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(1);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      document.body.append(renderer.domElement);
      const scene = new THREE.Scene();
      scene.background = new THREE.Color('#172330');
      scene.add(new THREE.HemisphereLight('#d7eeff', '#5b5047', 2));
      const light = new THREE.DirectionalLight('#fff0da', 3);
      light.position.set(152, 8, 23);
      light.target.position.set(149, 1, 27);
      light.castShadow = true;
      light.shadow.mapSize.set(1024, 1024);
      Object.assign(light.shadow.camera, {
        left: -6,
        right: 6,
        top: 6,
        bottom: -6,
        near: 0.1,
        far: 20,
      });
      scene.add(light, light.target);
      const wood = new THREE.MeshStandardMaterial({ color: '#715b40', roughness: 0.85 });
      for (const box of map.boxes) {
        if (
          box.visible === false ||
          box.mat !== 'wood' ||
          box.center.x < 143 ||
          box.center.x > 153 ||
          box.center.z < 26 ||
          box.center.z > 28
        )
          continue;
        const mesh = new THREE.Mesh(
          new THREE.BoxGeometry(box.size.x, box.size.y, box.size.z),
          wood,
        );
        mesh.position.set(box.center.x, box.center.y, box.center.z);
        if (box.rot)
          mesh.rotation.set(...['x', 'y', 'z'].map((a) => THREE.MathUtils.degToRad(box.rot[a])));
        mesh.castShadow = mesh.receiveShadow = true;
        scene.add(mesh);
      }
      const kit = await loadSoldiers(renderer, {}, { base: '/' });
      const before = new Soldier(kit, 0);
      const after = new Soldier(
        {
          ...kit,
          footSupport: (x, y, z) => {
            const hit = world.castVisibleRay({ x, y, z }, { x: 0, y: -1, z: 0 }, 1.2);
            return hit && hit.normal.y > 0.65 ? hit.point.y : null;
          },
        },
        0,
      );
      scene.add(before.root, after.root);
      const camera = new THREE.PerspectiveCamera(45, 1, 0.05, 100);
      const samples = report.variants[0].samples;
      const select = document.getElementById('position');
      samples.forEach((sample, i) =>
        select.add(new Option(`Stair x=${sample.requestedX}`, String(i))),
      );
      let crouched = false;
      document.getElementById('stance').onclick = () => {
        crouched = !crouched;
        document.getElementById('stance').textContent = crouched
          ? 'Switch to standing'
          : 'Switch to crouched';
      };
      document.getElementById('status').textContent = 'Loaded — local inspection fixture';
      let last = performance.now();
      const timings = [];
      function frame(now) {
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        const feet = samples[Number(select.value)].feet;
        const pose = {
          ...feet,
          yaw: Math.PI / 2,
          pitch: 0,
          crouched,
          grounded: true,
          sprinting: false,
          alive: true,
        };
        before.update(pose, dt);
        const started = performance.now();
        after.update(pose, dt);
        timings.push(performance.now() - started);
        if (timings.length > 300) timings.shift();
        if (timings.length % 30 === 0) {
          const sorted = [...timings].sort((a, b) => a - b);
          document.getElementById('status').textContent =
            `After soldier update: median ${sorted[Math.floor(sorted.length * 0.5)].toFixed(2)} ms; p95 ${sorted[Math.floor(sorted.length * 0.95)].toFixed(2)} ms`;
        }
        const width = innerWidth,
          height = innerHeight - 100;
        if (renderer.domElement.width !== width || renderer.domElement.height !== height)
          renderer.setSize(width, height, false);
        camera.aspect = width / 2 / height;
        camera.updateProjectionMatrix();
        camera.position.set(feet.x + 2.1, feet.y + 1.45, feet.z + 2.6);
        camera.lookAt(feet.x, feet.y + 0.6, feet.z);
        renderer.setScissorTest(true);
        before.root.visible = true;
        after.root.visible = false;
        renderer.setViewport(0, 0, width / 2, height);
        renderer.setScissor(0, 0, width / 2, height);
        renderer.render(scene, camera);
        before.root.visible = false;
        after.root.visible = true;
        renderer.setViewport(width / 2, 0, width / 2, height);
        renderer.setScissor(width / 2, 0, width / 2, height);
        renderer.render(scene, camera);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
